apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sentinel
  namespace: agent-sentinel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sentinel-quarantine
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sentinel-quarantine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-sentinel-quarantine
subjects:
  - kind: ServiceAccount
    name: agent-sentinel
    namespace: agent-sentinel-system
