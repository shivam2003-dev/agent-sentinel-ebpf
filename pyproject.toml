[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel-ebpf"
version = "0.1.0"
description = "Intent-aware runtime detection and containment for AI agents on Kubernetes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Shivam Kumar"}]
keywords = ["ai-agents", "ebpf", "kubernetes", "runtime-security", "tetragon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]
pdf = ["reportlab>=4.2,<5", "pypdf>=5,<6"]

[project.scripts]
agent-sentinel = "agent_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/shivam2003-dev/agent-sentinel-ebpf"
Documentation = "https://github.com/shivam2003-dev/agent-sentinel-ebpf/tree/main/docs"
Issues = "https://github.com/shivam2003-dev/agent-sentinel-ebpf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
