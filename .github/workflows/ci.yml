name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,pdf]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest --cov=agent_sentinel --cov-report=term-missing
      - name: Build white paper
        run: python scripts/build_whitepaper.py --output /tmp/agent-sentinel-whitepaper.pdf
      - name: Verify repository artifacts
        run: python scripts/verify_repository.py
